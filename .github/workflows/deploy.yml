# --------------------------------------------------------------
# Deploy: 构建 → 推镜像仓库 → self-hosted runner 在 CVM 本地部署
# 触发：main 分支推送 + 手动触发
#
# 架构：
#   - build 用 GitHub-hosted runner 构建镜像并推 GHCR/TCR
#   - deploy 用 self-hosted runner（跑在 CVM 上）本地 docker compose up
# --------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: "重灌 seed（清空并重新导入画像/KOL数据）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  # 镜像仓库：默认用 GHCR（GitHub Container Registry）
  REGISTRY: ghcr.io
  # 镜像名前缀（GitHub 用户名或组织名）
  NAMESPACE: julia-lars

jobs:
  # ---------------- Job 1: 构建两个镜像并推送到镜像仓库 ----------------
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "value=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR（GitHub Actions 自带 GITHUB_TOKEN，无需额外配置）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/muru-thinktank-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=min

  # ---------------- Job 2: 在 CVM 上直接部署（self-hosted runner） ----------------
  deploy:
    name: Deploy on CVM
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push'
    steps:
      - name: Checkout deploy/（sparse + 超时重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}"
            rm -rf .git deploy 2>/dev/null || true
            git init -b main
            git remote add origin \
              "https://gh-proxy.com/https://github.com/${{ github.repository }}.git"
            git config core.sparseCheckout true
            git config core.sparseCheckoutCone false
            echo "deploy/" > .git/info/sparse-checkout
            git fetch --depth=1 origin ${{ github.sha }}
            git checkout FETCH_HEAD

      - name: Sync compose file to /opt/muru-thinktank
        run: |
          mkdir -p /opt/muru-thinktank
          cp deploy/docker-compose.prod.yml /opt/muru-thinktank/

      - name: Pull, migrate, seed, up
        working-directory: /opt/muru-thinktank
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "→ 将部署到 IMAGE_TAG=${IMAGE_TAG}"

          # 写入 IMAGE_TAG
          if grep -q '^IMAGE_TAG=' .env.prod; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.prod
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env.prod
          fi

          # 登录 GHCR（self-hosted runner 需要单独登录）
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # 1. 拉镜像
          docker compose --env-file .env.prod -f docker-compose.prod.yml pull

          # 2. 起 pg
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d postgres
          sleep 5

          # 3. migration
          docker compose --env-file .env.prod -f docker-compose.prod.yml \
            run --rm api bun run apps/api/src/db/migrate.ts

          # 4. seed（幂等：空库才灌，已有数据自动跳过）
          docker compose --env-file .env.prod -f docker-compose.prod.yml \
            run --rm api bun run apps/api/src/db/seed-personas.ts
          docker compose --env-file .env.prod -f docker-compose.prod.yml \
            run --rm api bun run apps/api/src/db/seed-kol.ts

          # 5. 启动 api + web
          docker compose --env-file .env.prod -f docker-compose.prod.yml \
            up -d --remove-orphans api web

          # 6. 清理旧镜像
          docker image prune -f

  # ---------------- Job 3: 手动触发强制重灌 seed ----------------
  seed:
    name: Force re-seed
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && inputs.run_seed == 'true'
    steps:
      - name: Re-seed personas + kol
        working-directory: /opt/muru-thinktank
        run: |
          set -euo pipefail
          docker compose --env-file .env.prod -f docker-compose.prod.yml \
            run --rm api bun run apps/api/src/db/seed-personas.ts --force
          docker compose --env-file .env.prod -f docker-compose.prod.yml \
            run --rm api bun run apps/api/src/db/seed-kol.ts --force
