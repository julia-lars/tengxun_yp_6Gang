# --------------------------------------------------------------
# Docker Compose 文件：定义"用一条命令能起来的一组服务"
# --------------------------------------------------------------

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: webtutor
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d webtutor"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://dev:dev@postgres:5432/webtutor?sslmode=disable
    command: pgweb --bind=0.0.0.0 --listen=8081
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local